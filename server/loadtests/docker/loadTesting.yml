version: "3"

services:
  postgres:
    image: postgres:15-alpine
    command: ["postgres", "-c", "max_connections=500"]
    container_name: prestopass-postgres
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres_admin
      POSTGRES_PASSWORD: secure_password_123
      POSTGRES_DB: ticket_booking_db
    volumes:
      - postgres_prestopass_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: prestopass-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_prestopass_data:/data

  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: prestopass-prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_prestopass_data:/prometheus
    # Explicitly enable the remote-write receiver flag required by k6
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-remote-write-receiver"

  grafana:
    image: grafana/grafana:10.0.0
    container_name: prestopass-grafana
    restart: always
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_prestopass_data:/var/lib/grafana

volumes:
  postgres_prestopass_data:
  redis_prestopass_data:
  prometheus_prestopass_data:
  grafana_prestopass_data:
