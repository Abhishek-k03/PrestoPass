[project]
name = "prestopass-server"
version = "1.0.0"
description = "FastAPI backend for PrestoPass"
requires-python = ">=3.13"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.4",
    "sqlalchemy[asyncio]==2.0.52",
    "asyncpg==0.31.0",
    "greenlet==3.5.5",
    "alembic==1.19.2",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "redis==8.1.0",
    "taskiq==0.12.6",
    "taskiq-redis==1.2.3",
    "python-socketio==5.16.4",
    "bcrypt==5.0.0",
    "pyjwt==2.13.0",
    "authlib==1.8.0",
    # Authlib prefers httpx2; without it Authlib emits a deprecation warning.
    "httpx2>=2.12.0",
    "itsdangerous>=2.2.0",
]

[dependency-groups]
dev = [
    "ruff>=0.9",
    "pytest>=8",
    "pytest-asyncio>=0.25",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.hatch.build]
artifacts = ["app/lua/*.lua"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    # mixedCase attribute names: deliberate. ORM attributes mirror the camelCase
    # database columns and the camelCase JSON contract exactly.
    "N815",
    # function-call-in-default-argument: this is how FastAPI Depends() and
    # taskiq TaskiqDepends() are meant to be written.
    "B008",
    "E501",
]
